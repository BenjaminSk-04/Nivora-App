name: Android APK
# Tag a release (git tag v1.0.0 && git push --tags) to build an APK and attach it to a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
      VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.0-dev.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: App icons (best effort, falls back to default icon)
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --assetPath resources
      - name: Permissions and version
        run: node scripts/patch-android.mjs
        env:
          VERSION_CODE: ${{ github.run_number }}
      - run: npx cap sync android

      # --- signed release build (when keystore secrets exist) ---
      - name: Build release APK
        if: env.KS_B64 != ''
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Sign release APK
        if: env.KS_B64 != ''
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cd android/app/build/outputs/apk/release
          "$BT/zipalign" -p 4 app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out "$GITHUB_WORKSPACE/Nivora-$VERSION_NAME.apk" aligned.apk
          "$BT/apksigner" verify "$GITHUB_WORKSPACE/Nivora-$VERSION_NAME.apk"

      # --- fallback: debug APK (installable for testing, not for Play Store) ---
      - name: Build debug APK (no keystore configured)
        if: env.KS_B64 == ''
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Nivora-$VERSION_NAME-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: nivora-apk
          path: Nivora-*.apk
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: Nivora-*.apk
          generate_release_notes: true

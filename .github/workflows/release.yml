name: Release APK

# Builds a SIGNED release APK.
#   - Push a tag such as v1.0  -> builds, signs, and attaches the APK to a GitHub Release.
#   - Or run it by hand from the Actions tab -> builds and uploads the APK as a workflow artifact.
# Required repository secrets are listed in docs/RELEASING.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installs Gradle 8.9 on the PATH, so the (uncommitted) wrapper jar is not needed.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Secret SIGNING_KEYSTORE_BASE64 is not set. See docs/RELEASING.md."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nivora-release.jks"

      - name: Build signed release APK
        working-directory: android
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/nivora-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify the APK is signed
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Name the files
        run: |
          NAME="Nivora-${GITHUB_REF_NAME//\//-}"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/$NAME.apk"
          (cd dist && sha256sum "$NAME.apk" > "$NAME.apk.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: nivora-signed-apk
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

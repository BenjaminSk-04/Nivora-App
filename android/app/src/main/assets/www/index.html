<meta name="theme-color" content="#0d9488" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','system-ui','sans-serif'] } } } }
</script>
<style>
  html { font-size: 16px; transition: font-size .2s ease; }
  html.large-text { font-size: 20px; }
  body { font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  *:focus-visible { outline: 3px solid #0d9488; outline-offset: 2px; border-radius: 4px; }
  .toast-in { animation: slideIn .3s ease-out; }
  @keyframes slideIn { from { transform: translateX(120%); opacity: 0 } to { transform: translateX(0); opacity: 1 } }
  #map { height: 380px; border-radius: 16px; z-index: 1; }
  .leaflet-container { font-family: Inter, sans-serif; }
  .no-scrollbar { scrollbar-width: none; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .tab-active { color: #0d9488; }
  .tab-active svg { stroke: #0d9488; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

<div id="app"></div>
<div id="toast-container" class="fixed top-4 right-4 z-[100] flex flex-col gap-2 pointer-events-none" aria-live="polite"></div>
<div id="modal-root"></div>

<!-- App code, split by feature. Plain (non-module) scripts share one global scope, so ORDER MATTERS:
     views are registered at load time, and boot.js (startup) must always load last. -->
<script src="js/utils.js"></script>  <!-- Shared helpers: formatting, dates, categories -->
<script src="js/assets.js"></script>  <!-- Logo images and SVG icons -->
<script src="js/identity.js"></script>  <!-- Stable "me" key + display-name helpers -->
<script src="js/state.js"></script>  <!-- State shape, storage, schema migrations, save/load -->
<script src="js/forms.js"></script>  <!-- Shared form-building helpers -->
<script src="js/ui-core.js"></script>  <!-- Toasts, modals, notifications -->
<script src="js/nav.js"></script>  <!-- Navigation bars, tabs, profile menu, views registry -->
<script src="js/profile.js"></script>  <!-- Profile + onboarding wizard + profile settings UI -->
<script src="js/charts.js"></script>  <!-- Progress bars, pie and line charts -->
<script src="js/dashboard.js"></script>  <!-- Home screen -->
<script src="js/expenses.js"></script>  <!-- Expenses list, add/edit/delete, receipts -->
<script src="js/budgets.js"></script>  <!-- Budgets screen and editing -->
<script src="js/splits.js"></script>  <!-- Shared expenses, flatmates, settle-up, UPI -->
<script src="js/medicines.js"></script>  <!-- Medicine reminders, stock, duplicates, caregiver -->
<script src="js/insights.js"></script>  <!-- Insights + past-month spending -->
<script src="js/settings.js"></script>  <!-- Settings screen -->
<script src="js/backup.js"></script>  <!-- Backup / restore -->
<script src="js/smart-add.js"></script>  <!-- Quick add + bank SMS parsing -->
<script src="js/bills.js"></script>  <!-- Bills, balance forecast, low-balance alerts -->
<script src="js/scan-bill.js"></script>  <!-- Scan bill (camera/gallery + OCR) -->
<script src="js/render.js"></script>  <!-- Router render() + dose-reminder scheduling -->
<script src="js/boot.js"></script>  <!-- Startup sequence - MUST stay last -->
</body>
</html>

const pad = n => String(n).padStart(2,'0');
const uid = () => Math.random().toString(36).slice(2, 10);

const todayISO = () => { 
  const d = new Date(); 
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; 
};
const daysAgoISO = n => { 
  const d = new Date(); 
  d.setDate(d.getDate()-n); 
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; 
};

const fmtINR = n => new Intl.NumberFormat('en-IN', { style:'currency', currency:'INR', maximumFractionDigits: 0 }).format(n);
const fmtINR2 = n => new Intl.NumberFormat('en-IN', { style:'currency', currency:'INR', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fmtTime12(t) {
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  const hh = h % 12 || 12;
  return `${hh}:${pad(m || 0)} ${ampm}`;

function autoCategorize(notes='') {
  const n = notes.toLowerCase();
  const rules = [
    [/\b(groceries|vegetables|milk|bread|bigbasket|blinkit|zepto|dmart|chai|snack)/, 'Food'],
    [/\b(swiggy|zomato|restaurant|cafe|dinner|lunch|breakfast|food)/, 'Food'],
    [/\b(rent|maintenance|society)/, 'Rent'],
    [/\b(electricity|mseb|water|gas|wifi|fiber|internet|broadband|utility|bill)/, 'Utilities'],
    [/\b(uber|ola|auto|petrol|diesel|metro|bus|train|transport)/, 'Transport'],
    [/\b(medicine|pharmacy|doctor|hospital|clinic|medical|chemist|inhaler|tablet|health)/, 'Health'],
    [/\b(netflix|spotify|prime|hotstar|movie|game|entertainment)/, 'Entertainment'],
  ];
  for (const [re, cat] of rules) if (re.test(n)) return cat;
  return 'Other';
}

/* The signed-in user is always represented internally by this fixed key — never by their
   display name, which can change. This keeps old records (who paid, who owes whom) stable
   even if the person later edits their name in Settings. displayName()/nameOf() below turn
   it back into something human for the UI. */
const ME = '__me__';
function displayName(key) { return key === ME ? (state.user.name || 'You') : key; }
function nameOf(key) { return key === ME ? 'You' : key; }
function membersList() { return [ME, ...(state.flatmates || [])]; }

/* A brand-new install starts completely empty — no sample expenses, no sample
   medicines, no fictional flatmates. Real users don't want someone else's demo
   data sitting in their app. Budgets keep sensible starting numbers (you can
   change or zero them out in Budgets any time); everything else starts blank. */
function buildSeed() {
  return {
    user: { name:'', email:'', avatarInitials:'', largeText:false, notifications:true, lowBalanceThreshold:1000 },
    budgets: { Food:6000, Rent:8500, Utilities:1800, Transport:1200, Health:2500, Entertainment:1000, Other:4000 },
    totalBudgetMonthly: 25000,
    expenses: [], medicines: [], savingsTracker: [], notifications: [],
    flatmates: [], groupName: '',
    profiles: {},
  };
}

const STORE_KEY = 'nivora_v1';
let state = null;
const LOCAL_USER_EMAIL = 'me@nivora.local';

/* Storage wrappers: safe under private mode / quota errors / disabled storage.
   State always lives in memory, so the app still works if persistence fails. */
const store = {
  get(k)    { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } },
  remove(k) { try { localStorage.removeItem(k); } catch {} },
};

/* Schema versioning: bump SCHEMA_VERSION when the stored shape changes and add a step to
   MIGRATIONS[newVersion] that mutates/returns the old state. User data is never wiped. */
const SCHEMA_VERSION = 3;
const MIGRATIONS = {
  2: s => { // per-account profiles; existing account counts as already onboarded
    s.profiles = s.profiles || {};
    const key = String(s.user?.email || '').toLowerCase();
    if (key && !s.profiles[key]) s.profiles[key] = { ...blankProfile(), onboarded: true };
    return s;
  },
  3: s => { // "me" is now a stable internal key (ME) instead of the hardcoded demo
            // name 'Aarav', and flatmates/group name are real, user-managed data.
    const LEGACY_ME = 'Aarav';
    const foundFlatmates = new Set();
    for (const e of (s.expenses || [])) {
      if (e.paidBy === LEGACY_ME) e.paidBy = ME;
      if (e.split) {
        e.split.members = (e.split.members || []).map(m => m === LEGACY_ME ? ME : m);
        if (e.split.shares && Object.prototype.hasOwnProperty.call(e.split.shares, LEGACY_ME)) {
          e.split.shares[ME] = e.split.shares[LEGACY_ME];
          delete e.split.shares[LEGACY_ME];
        }
        for (const m of e.split.members) if (m !== ME) foundFlatmates.add(m);
      }
    }
    if (!Array.isArray(s.flatmates)) s.flatmates = [...foundFlatmates];
    if (typeof s.groupName !== 'string') s.groupName = '';
    return s;
  },
};
function migrateState(s) {
  let v = Number(s.schemaVersion) || 1;
  while (v < SCHEMA_VERSION) { v++; if (MIGRATIONS[v]) s = MIGRATIONS[v](s); }
  s.schemaVersion = SCHEMA_VERSION;
  return s;
}
function freshState() { const s = buildSeed(); s.schemaVersion = SCHEMA_VERSION; return s; }

let storageWarned = false;
function loadState() { try { const raw = store.get(STORE_KEY); return raw ? JSON.parse(raw) : null; } catch { return null; } }
function saveState() {
  if (!store.set(STORE_KEY, JSON.stringify(state)) && !storageWarned) {
    storageWarned = true;
    toast('Storage is unavailable — changes will be lost when you close this tab', 'warning');
  }
}
function clearAllData() { store.remove(STORE_KEY); state = freshState(); saveState(); obReset(); navigate('/onboarding'); toast('All data cleared', 'success'); }

/* LEGACY one-time wipe for data written before v1.5 (its shape is unknown). Do NOT bump this
   constant for future changes - use SCHEMA_VERSION + MIGRATIONS above instead. */
const LEGACY_SEED_VERSION = 'v1.5';
if (store.get('nivora_seed_ver') !== LEGACY_SEED_VERSION) {
  store.remove(STORE_KEY);
  store.set('nivora_seed_ver', LEGACY_SEED_VERSION);
}
{
  const loaded = loadState();
  state = (loaded && loaded.user) ? migrateState(loaded) : freshState();
  saveState();
}
if (state.user.largeText) document.documentElement.classList.add('large-text');

const initialsOf = n => n.split(' ').filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase() || '?';
function setUserName(name) {
  state.user.name = name;
  state.user.email = LOCAL_USER_EMAIL;
  state.user.avatarInitials = initialsOf(name);
  saveState();
}
/* Nivora is a single local-profile app: there's no server account, so "sign out" really
   means "clear my profile & data and start the onboarding wizard again". */
function isOnboarded() { return !!getProfile()?.onboarded; }
function resetProfile() {
  closeModal();
  if (state.profiles) delete state.profiles[profileKey()];
  obReset();
  navigate('/onboarding');
}

/* ---------- Profile data + onboarding wizard ---------- */
function blankProfile() {
  return { name:'', dob:'', gender:'', genderOther:'', phone:'', city:'', bloodGroup:'', allergies:'', conditions:[],
           emergencyName:'', emergencyRelation:'', emergencyPhone:'', monthlyIncome:'', monthlyBudget:'', goals:[], onboarded:false };
}
const profileKey = () => String(state.user.email || LOCAL_USER_EMAIL).toLowerCase();
function getProfile() { return state.profiles?.[profileKey()] || null; }
function setProfile(patch) {
  state.profiles = state.profiles || {};
  state.profiles[profileKey()] = { ...blankProfile(), ...(state.profiles[profileKey()] || {}), ...patch };

}

const digitsOf = v => String(v || '').replace(/\D/g, '');
const phoneOk = v => !v || (/^[+\d\s()-]+$/.test(v) && digitsOf(v).length >= 10 && digitsOf(v).length <= 13);
function ageFromDob(iso) {
  const [y, m, d] = String(iso).split('-').map(Number); if (!y) return null;
  const t = new Date(); let a = t.getFullYear() - y;
  if (t.getMonth() + 1 < m || (t.getMonth() + 1 === m && t.getDate() < d)) a--;
  return a;
}
function fmtDob(iso) { const d = new Date(iso + 'T00:00:00'); return isNaN(d) ? '' : d.toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' }); }
function validDob(iso) {
  const [y, m, d] = String(iso).split('-').map(Number);
  const dt = new Date(y, (m || 1) - 1, d || 1);
  if (!y || dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return 'That date does not exist.';
  if (ageFromDob(iso) < MIN_AGE) return `You must be at least ${MIN_AGE} years old to use Nivora.`;
  if (ageFromDob(iso) > 110) return 'Please check the year of birth.';
  return '';
}
function applyBudget(amount) {
  const b = Number(amount);
  if (amount === '' || !Number.isFinite(b) || b < 0 || b === totalBudget()) return;
  state.totalBudgetMonthly = b; distributeTotalBudget(b);
}

function obValidate() {
  const id = OB_STEPS[ob.step].id, d = ob.d;
  if (id === 'dob') return d.dob ? validDob(d.dob) : 'Please select your full date of birth.';
  if (id === 'gender' && d.gender === 'Other (please specify)' && !d.genderOther) return 'Please tell us how you identify, or choose another option.';
  if (id === 'contact' && !phoneOk(d.phone)) return 'Enter a valid phone number (10 to 13 digits).';
  if (id === 'emergency') {
    if (!phoneOk(d.emergencyPhone)) return 'Enter a valid phone number (10 to 13 digits).';
    if (d.emergencyName && !d.emergencyPhone) return 'Add a phone number for your emergency contact.';

  if (id === 'money') for (const k of ['monthlyIncome', 'monthlyBudget']) if (d[k] !== '' && !(Number(d[k]) >= 0)) return 'Enter amounts as positive numbers.';

function toast(msg, type='info') {
  const colors = { info:'bg-slate-800', success:'bg-teal-600', error:'bg-red-600', warning:'bg-amber-500' };
  const el = document.createElement('div');
  el.className = `toast-in ${colors[type]} text-white px-4 py-3 rounded-xl shadow-lg max-w-sm text-sm font-medium pointer-events-auto flex items-start gap-2`;
  el.innerHTML = `<span class="mt-0.5">${type==='error'||type==='warning'?'⚠️':type==='success'?'✅':'ℹ️'}</span> <span>${esc(msg)}</span>`;
  $('#toast-container').appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

function openModal(title, bodyHTML, onMount) {
  const root = $('#modal-root');
  root.innerHTML = `
    <div class="fixed inset-0 bg-slate-900/50 z-[80] flex items-end sm:items-center justify-center p-0 sm:p-4" data-modal-backdrop>

        </div>
        <div class="p-5">${bodyHTML}</div>
      </div>
    </div>`;
  root.querySelectorAll('[data-close-modal]').forEach(b => b.addEventListener('click', closeModal));
  root.querySelector('[data-modal-backdrop]').addEventListener('click', e => { if (e.target.dataset.modalBackdrop !== undefined) closeModal(); });
  
  const focusables = root.querySelectorAll('button, input, select, textarea, a[href]');
  if (focusables.length) focusables[0].focus();
  root.onkeydown = e => {
    if (e.key === 'Escape') { closeModal(); return; }
    if (e.key === 'Tab') {
      if (e.shiftKey && document.activeElement === focusables[0]) { e.preventDefault(); focusables[focusables.length-1].focus(); }
      else if (!e.shiftKey && document.activeElement === focusables[focusables.length-1]) { e.preventDefault(); focusables[0].focus(); }
    }
  };

  if (onMount) onMount(root);
}

async function ensureNotificationPerm() {

}

function computeBalances(expenses, members) {
  // Union with everyone who actually appears in a historical split, so a flatmate who was
  // later removed from the group doesn't silently vanish from (or corrupt) past balances.
  const all = new Set(members);
  for (const e of expenses) if (e.split) for (const m of e.split.members) all.add(m);
  const bal = Object.fromEntries([...all].map(m => [m, 0]));
  for (const e of expenses) {
    if (!e.split) continue;
    for (const m of e.split.members) bal[m] = (bal[m] || 0) - (e.split.shares[m] || 0);
    bal[e.paidBy] = (bal[e.paidBy] || 0) + e.amount;
  }
  for (const k of Object.keys(bal)) bal[k] = Number(bal[k].toFixed(2));
  return bal;
}
function settleUp(balances) {
  const creds = Object.entries(balances).filter(([,v]) => v > 0.01).map(([n,v]) => ({ n, v })).sort((a,b) => b.v - a.v);
  const debts = Object.entries(balances).filter(([,v]) => v < -0.01).map(([n,v]) => ({ n, v: -v })).sort((a,b) => b.v - a.v);
  const txns = [];
  let i = 0, j = 0;
  while (i < creds.length && j < debts.length) {
    const amt = Math.min(creds[i].v, debts[j].v);
    if (amt > 0.01) txns.push({ from: debts[j].n, to: creds[i].n, amount: Number(amt.toFixed(2)) });
    creds[i].v -= amt; debts[j].v -= amt;
    if (creds[i].v < 0.01) i++;
    if (debts[j].v < 0.01) j++;
  }
  return txns;
}

function isDoseDue(med, dateISO) {
  if (!med.active) return false;
  if (med.startDate && dateISO < med.startDate) return false;
  if (med.endDate && dateISO > med.endDate) return false;
  const diffDays = Math.floor((new Date(dateISO) - new Date(med.startDate)) / 86400000);
  if (med.frequency === 'daily') return true;
  if (med.frequency === 'alternate') return diffDays % 2 === 0;
  if (med.frequency === 'weekly') return new Date(dateISO).getDay() === new Date(med.startDate).getDay();
  return true;
}
function todaysDoses() {
  const today = todayISO();
  const out = [];
  for (const med of state.medicines) {
    if (!isDoseDue(med, today)) continue;
    for (const t of med.times) {
      out.push({ med, time: t, status: med.log?.[today]?.[t] || 'pending' });
    }
  }
  return out.sort((a,b) => a.time.localeCompare(b.time));
}
function markDose(medId, time, status) {
  const med = state.medicines.find(m => m.id === medId);
  if (!med) return;
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const [doseHour, doseMinute] = time.split(':').map(Number);
  if (nowMin < doseHour * 60 + doseMinute) {
    return toast('This medicine is not due yet', 'warning');
  }
  med.log = med.log || {}; med.log[todayISO()] = med.log[todayISO()] || {};
  if (med.log[todayISO()][time] === status) return;
  const wasTaken = med.log[todayISO()][time] === 'taken';
  med.log[todayISO()][time] = status;
  if (status === 'taken') med.stock = Math.max(0, med.stock - 1);
  else if (wasTaken) med.stock += 1;
  saveState(); toast(status === 'taken' ? 'Dose taken' : 'Dose skipped', status === 'taken' ? 'success' : 'warning'); render();
  if (status === 'skipped') setTimeout(() => caregiverPrompt(med, time), 60);
}
function adherence() {
  let taken = 0, total = 0;
  for (let i = 0; i < 30; i++) {
    const d = daysAgoISO(i);
    for (const med of state.medicines) {
      if (!isDoseDue(med, d)) continue;
      for (const t of med.times) { total++; if (med.log?.[d]?.[t] === 'taken') taken++; }
    }
  }
  return total ? Math.round((taken / total) * 100) : 0;
}

function myShare(e) { if (e.settlement) return 0; if (e.split) return e.split.shares[ME] || 0; return (e.paidBy && e.paidBy !== ME) ? 0 : e.amount; }
function expensesThisMonth() { return state.expenses.filter(e => monthKey(e.date) === thisMonthKey()); }
function expensesPrevMonth() { return state.expenses.filter(e => monthKey(e.date) === prevMonthKey()); }
function totalSpentThisMonth() { return expensesThisMonth().reduce((s,e) => s + myShare(e), 0); }
function totalBudget() {
  const savedTotal = Number(state.totalBudgetMonthly);
  return Number.isFinite(savedTotal) && savedTotal >= 0
    ? savedTotal
    : Object.values(state.budgets).reduce((s,v) => s+Number(v || 0), 0);
}
function distributeTotalBudget(total) {
  const weights = CATEGORIES.map(c => Math.max(0, Number(state.budgets?.[c] || 0)));
  const weightSum = weights.reduce((sum, value) => sum + value, 0);
  const effectiveWeights = weightSum > 0 ? weights : CATEGORIES.map(() => 1);
  const denominator = effectiveWeights.reduce((sum, value) => sum + value, 0);
  let allocated = 0;
  state.budgets = {};
  CATEGORIES.forEach((category, index) => {
    const amount = index === CATEGORIES.length - 1
      ? Math.max(0, total - allocated)
      : Math.round(total * effectiveWeights[index] / denominator);
    state.budgets[category] = amount;
    allocated += amount;
  });
}
function categorySpentThisMonth() {
  const map = Object.fromEntries(CATEGORIES.map(c => [c, 0]));
  for (const e of expensesThisMonth()) map[e.category] = (map[e.category] || 0) + myShare(e);
  return map;
}
function categorySpentPrevMonth() {
  const map = Object.fromEntries(CATEGORIES.map(c => [c, 0]));
  for (const e of expensesPrevMonth()) map[e.category] = (map[e.category] || 0) + myShare(e);
  return map;
}

}
function budgetColor(pct) { return pct < 70 ? '#0d9488' : pct < 90 ? '#f59e0b' : '#dc2626'; }
function pieChart(data) {
  const total = data.reduce((s,d) => s + d.value, 0);
  if (!total) return '<p class="text-sm text-slate-500 text-center">No data</p>';
  let angle = -Math.PI/2, cx=100, cy=100, r=76;
  const live = data.filter(d => d.value > 0);
  if (live.length === 1) return `<svg viewBox="0 0 200 200" class="w-full max-w-[220px] mx-auto"><circle cx="100" cy="100" r="76" fill="${live[0].color}" stroke="white" stroke-width="2"><title>${live[0].label}: ${fmtINR(live[0].value)}</title></circle><circle cx="100" cy="100" r="42" fill="white"/></svg>`;
  const slices = live.map(d => {
    const frac = d.value / total, next = angle + frac * 2 * Math.PI;
    const x1 = cx + r*Math.cos(angle), y1 = cy + r*Math.sin(angle);
    const x2 = cx + r*Math.cos(next), y2 = cy + r*Math.sin(next);
    const large = frac > 0.5 ? 1 : 0;
    const path = `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z`;
    angle = next;
    return `<path d="${path}" fill="${d.color}" stroke="white" stroke-width="2"><title>${d.label}: ${fmtINR(d.value)}</title></path>`;
  }).join('');
  return `<svg viewBox="0 0 200 200" class="w-full max-w-[220px] mx-auto">${slices}<circle cx="100" cy="100" r="42" fill="white"/></svg>`;
}
function lineChart(points) {
  if (!points.length) return '';
  const w=400, h=160, padX=24, padY=24, max = Math.max(...points.map(p => p.value), 1);
  const step = (w - 2*padX) / Math.max(points.length - 1, 1);
  const coords = points.map((p,i) => ({ x: padX + i*step, y: h - padY - (p.value/max)*(h - 2*padY), ...p }));
  const pts = coords.map(c => `${c.x},${c.y}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" class="w-full">
    <defs><linearGradient id="grad-teal" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#0d9488" stop-opacity="0.25"/><stop offset="100%" stop-color="#0d9488" stop-opacity="0"/></linearGradient></defs>
    <path d="M ${coords[0].x} ${h-padY} L ${pts.split(' ').join(' L ')} L ${coords[coords.length-1].x} ${h-padY} Z" fill="url(#grad-teal)"/>
    <polyline points="${pts}" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round"/>
    ${coords.map(c => `<circle cx="${c.x}" cy="${c.y}" r="3.5" fill="white" stroke="#0d9488" stroke-width="2"><title>${c.label}: ${fmtINR(c.value)}</title></circle>`).join('')}
    ${coords.map(c => `<text x="${c.x}" y="${h-4}" text-anchor="middle" font-size="9" fill="#64748b">${c.label}</text>`).join('')}
  </svg>`;
}

function toggleProfileMenu(force) {
  const m = $('#profileMenu'), b = $('#profileBtn'); if (!m || !b) return;

  if (open) m.querySelector('[role=menuitem]')?.focus();
}

/* ---------- Past month spending (Insights) ---------- */
function pastMonthStats(days = 30) {
  const byDay = {};
  for (const e of state.expenses) { const a = myShare(e); if (a > 0) { const k = String(e.date).slice(0, 10); byDay[k] = (byDay[k] || 0) + a; } }
  const cur = [];
  for (let i = days - 1; i >= 0; i--) { const iso = daysAgoISO(i); cur.push({ iso, value: byDay[iso] || 0 }); }
  let prev = 0; for (let i = days; i < days * 2; i++) prev += byDay[daysAgoISO(i)] || 0;
  const total = cur.reduce((t, d) => t + d.value, 0);
  const top = cur.reduce((b, d) => d.value > b.value ? d : b, cur[0]);
  return { cur, total, prev, avg: total / days, top, diff: total - prev, pct: prev > 0 ? (total - prev) / prev * 100 : null };
}
const pmDay = (iso, long) => new Date(iso + 'T00:00:00').toLocaleDateString('en-IN', long ? { weekday:'short', day:'numeric', month:'long' } : { day:'numeric', month:'short' });
function pmSelect(el) {
  document.querySelectorAll('.pm-bar').forEach(b => b.setAttribute('opacity', b === el ? '1' : '0.5'));
  const out = document.getElementById('pmReadout');
  if (out) out.innerHTML = `<b class="text-slate-900">${esc(pmDay(el.dataset.iso, true))}</b> · ${Number(el.dataset.v) > 0 ? fmtINR(Number(el.dataset.v)) : 'no spending'}`;
}
function pastMonthHTML() {
  const st = pastMonthStats(30);
  const head = `<h2 class="font-bold text-slate-900">Past month spending</h2><p class="text-sm text-slate-500">Daily expenses, last 30 days</p>`;
  if (st.total <= 0) return `<div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">${head}
    <p class="text-slate-500 text-sm mt-6 mb-2 text-center">No spending recorded in the last 30 days. Add an expense to see your daily pattern.</p></div>`;
  const W = 600, H = 160, base = 150, top = 14, n = st.cur.length, slot = (W - 16) / n, bw = slot * 0.62;
  const max = Math.max(...st.cur.map(d => d.value), 1), y = v => base - (v / max) * (base - top);
  const bars = st.cur.map((d, i) => {
    const x = 8 + i * slot + (slot - bw) / 2, h = Math.max(d.value > 0 ? (d.value / max) * (base - top) : 2, 2), isTop = d.iso === st.top.iso;
    return `<rect class="pm-bar" x="${x.toFixed(1)}" y="${(base - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${d.value <= 0 ? '#e2e8f0' : isTop ? '#0f766e' : '#14b8a6'}"
      opacity="1" data-iso="${d.iso}" data-v="${Math.round(d.value)}" tabindex="0" role="button" aria-label="${esc(pmDay(d.iso, true))}: ${d.value > 0 ? fmtINR(d.value) : 'no spending'}"
      onclick="pmSelect(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();pmSelect(this)}" style="cursor:pointer"><title>${esc(pmDay(d.iso))}: ${d.value > 0 ? fmtINR(d.value) : 'no spending'}</title></rect>`;
  }).join('');
  const ticks = [0, 6, 12, 18, 24, 29].map(i => `<text x="${(8 + i * slot + slot / 2).toFixed(1)}" y="${H + 14}" font-size="11" fill="#64748b" text-anchor="${i === 0 ? 'start' : i === 29 ? 'end' : 'middle'}">${esc(pmDay(st.cur[i].iso))}</text>`).join('');
  const avgY = y(st.avg).toFixed(1);
  const up = st.diff > 0, flat = Math.abs(st.diff) < 1;
  const cmpColor = flat ? 'text-slate-700' : up ? 'text-red-600' : 'text-teal-700';
  const cmpText = flat ? 'Same' : `${up ? '↑' : '↓'} ${fmtINR(Math.abs(st.diff))}`;
  const summary = st.prev <= 0 ? `You spent <b>${fmtINR(st.total)}</b> in the last 30 days.`
    : flat ? `You spent <b>${fmtINR(st.total)}</b>, about the same as the previous 30 days.`
    : `You spent <b>${fmtINR(st.total)}</b>, <b class="${cmpColor}">${fmtINR(Math.abs(st.diff))} ${up ? 'more' : 'less'}</b> than the previous 30 days${st.pct !== null ? ` (${Math.abs(Math.round(st.pct))}%)` : ''}.`;
  const tile = (label, val, cls = 'text-slate-900') => `<div class="bg-slate-50 rounded-2xl px-2 py-3 text-center"><p class="text-[11px] font-semibold uppercase tracking-wide text-slate-500">${label}</p><p class="text-lg font-extrabold mt-1 ${cls}">${val}</p></div>`;
  return `<div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
    ${head}
    <p class="text-sm text-slate-700 mt-3">${summary}</p>
    <p id="pmReadout" aria-live="polite" class="text-sm text-slate-500 mt-3 min-h-[1.25rem]">Tap a bar to see that day's spending.</p>
    <div class="mt-1 overflow-x-auto no-scrollbar"><svg viewBox="0 0 ${W} ${H + 20}" class="w-full min-w-[420px]" role="group" aria-label="Daily spending bar chart for the last 30 days">
      <line x1="8" y1="${base}" x2="${W - 8}" y2="${base}" stroke="#e2e8f0"/>
      <line x1="8" y1="${avgY}" x2="${W - 8}" y2="${avgY}" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="${W - 8}" y="${Number(avgY) - 4}" font-size="11" fill="#b45309" text-anchor="end">Avg ${fmtINR(st.avg)}/day</text>
      ${bars}${ticks}</svg></div>
    <div class="grid grid-cols-3 gap-3 mt-3">
      ${tile('Total', fmtINR(st.total))}${tile('Daily avg', fmtINR(st.avg))}${tile('vs previous 30 days', cmpText, cmpColor)}
    </div>
    <p class="text-sm text-slate-500 mt-3">Highest day: <b class="text-slate-800">${esc(new Date(st.top.iso + 'T00:00:00').toLocaleDateString('en-IN', { day:'numeric', month:'long' }))}</b> (${fmtINR(st.top.value)})</p>
  </div>`;
}

/* ---------- Duplicate medicine detection + beep alert ---------- */
function beepAlert(times = 3) {
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ctx = new AC(); if (ctx.state === 'suspended') ctx.resume();
    for (let i = 0; i < times; i++) {
      const t = ctx.currentTime + i * 0.35, o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'square'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + 0.27);
    }
    setTimeout(() => { try { ctx.close(); } catch {} }, times * 350 + 400);
  } catch {}
  try { navigator.vibrate && navigator.vibrate([200, 100, 200, 100, 200]); } catch {}
}
/* "Common drug name" = same brand name or same active ingredient, ignoring strength and form (e.g. 500mg, tablet). */
function drugKey(v) {
  return String(v || '').toLowerCase()
    .replace(/\d+(\.\d+)?\s*(mg|mcg|µg|g|ml|iu|%)/g, ' ')
    .replace(/\b(tablets?|tabs?|capsules?|caps?|syrup|inhaler|injection|cream|drops?|sr|er|ip)\b/g, ' ')
    .replace(/[^a-z]+/g, ' ').trim();
}
function findDuplicateMeds(med, list = state.medicines) {
  const keys = [drugKey(med.name), drugKey(med.salt)].filter(Boolean);
  return list.filter(m => m !== med && m.id !== med.id && [drugKey(m.name), drugKey(m.salt)].some(k => k && keys.includes(k)));
}
function duplicateGroups() {
  const seen = new Set(), groups = [];
  for (const m of state.medicines) {
    if (seen.has(m.id)) continue;
    const dups = findDuplicateMeds(m);
    if (dups.length) { [m, ...dups].forEach(x => seen.add(x.id)); groups.push([m, ...dups]); }
  }
  return groups;
}
function duplicateBannerHTML() {
  const g = duplicateGroups(); if (!g.length) return '';
  return `<div role="alert" class="bg-red-50 border border-red-200 text-red-800 rounded-2xl p-4">
    <p class="font-bold">⚠️ Duplicate medicine</p>
    ${g.map(grp => `<p class="text-sm mt-1">You have ${grp.length} entries for the same drug: <b>${grp.map(m => esc(m.name)).join(', ')}</b>. Taking both may mean a double dose. Check with your doctor or pharmacist.</p>`).join('')}
  </div>`;
}
let pendingMed = null;
function commitMedicine(med) {
  state.medicines.push(med);
  saveState(); closeModal(); render(); toast('Medicine added', 'success');
}
function showDuplicateAlert(med, dups) {
  pendingMed = med; beepAlert(3);
  openModal('⚠️ Duplicate medicine alert', `
    <div role="alert" class="text-center">
      <div class="text-6xl mb-3" aria-hidden="true">🚨</div>
      <p class="text-lg font-bold text-red-700">"${esc(med.name)}" is already in your list</p>
      <p class="text-slate-600 mt-2 text-sm">Same drug name or active ingredient as: <b>${dups.map(m => esc(m.name) + (m.salt ? ` (${esc(m.salt)})` : '')).join(', ')}</b>.</p>
      <p class="text-slate-600 mt-2 text-sm">Taking two of the same medicine can cause an overdose. Please confirm with your doctor or pharmacist.</p>
    </div>
    <div class="flex gap-2 pt-5">
      <button onclick="closeModal(); pendingMed = null" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-lg">Cancel</button>
      <button onclick="commitMedicine(pendingMed); pendingMed = null" class="flex-1 border border-slate-300 text-slate-700 font-medium py-3 rounded-lg">Add anyway</button>
    </div>`);
}

/* ---------- Backup & Restore ----------
   In the Android app, window.AndroidBridge.saveBackup()/pickBackup() are injected by
   MainActivity.kt and use Android's Storage Access Framework so the user picks a real
   file location (Downloads, Drive, etc). In a plain browser there is no such bridge,

function setBackupStatus(msg) { const el = document.getElementById('backupLastAction'); if (el) el.textContent = msg; }
function backupPayload() {

/* Dose reminders fire only during the exact scheduled clock minute.
   Fired keys are persisted per day so a reload does not re-fire them.
   Browser/OS background throttling can delay or suppress reminders while the page is inactive. */
const FIRED_KEY = 'nivora_fired';
const firedReminders = (() => {
  try { const o = JSON.parse(store.get(FIRED_KEY) || '{}'); return new Set(o.day === todayISO() ? o.keys : []); }
  catch { return new Set(); }
})();
function persistFired() {
  const today = todayISO();
  for (const k of firedReminders) if (!k.startsWith(today)) firedReminders.delete(k);
  store.set(FIRED_KEY, JSON.stringify({ day: today, keys: [...firedReminders] }));
}
function checkDoseReminders() {
  if (!isOnboarded() || !state.user.notifications) return;
  const now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes(), today = todayISO();
  for (const d of todaysDoses()) {
    if (d.status !== 'pending') continue;
    const [h, m] = d.time.split(':').map(Number);
    if (nowMin !== h * 60 + (m || 0)) continue;
    const key = `${today}|${d.med.id}|${d.time}`;
    if (firedReminders.has(key)) continue;
    firedReminders.add(key); persistFired();
    fireReminder('💊 Medicine reminder', `It is time to take ${d.med.name} (${fmtTime12(d.time)}).`);
  }
}

/* ---- 2. Safe to spend + low-balance forecast ---- */
function unpaidBills() { const mk = thisMonthKey(); return ext().bills.filter(b => b.paidMonth !== mk); }
function safeToSpend() {
  const b = totalBudget(); if (!(b > 0)) return null;
  const now = new Date(), left = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate() - now.getDate() + 1;
  const today = state.expenses.filter(e => e.date === todayISO()).reduce((s, e) => s + myShare(e), 0);
  const pool = b - totalSpentThisMonth() - unpaidBills().reduce((s, x) => s + x.amount, 0);
  const perDay = Math.max(0, pool + today) / left;
  return { pool, perDay, left, remainingToday: Math.max(0, perDay - today), over: pool < 0 };
}
function nextDue(b) {
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  const at = (yy, mm) => new Date(yy, mm, Math.min(b.dueDay, new Date(yy, mm + 1, 0).getDate()));
  return b.paidMonth === thisMonthKey() ? at(y, m + 1) : at(y, m);
}
function balanceForecast() {
  const e = ext(); if (e.balance == null) return null;
  const end = new Date(); end.setDate(end.getDate() + 30);
  const due = e.bills.map(b => ({ b, d: nextDue(b) })).filter(x => x.d <= end).sort((a, b) => a.d - b.d);
  let run = e.balance, breach = null;
  for (const x of due) { run -= x.b.amount; if (run < e.lowAt && !breach) breach = { title:x.b.title, date:x.d, bal:run }; }
  return { projected: run, breach };
}

      scanKind = b.dataset.k;
      root.querySelectorAll('#scKind [data-k]').forEach(x => x.className = `py-2 rounded-lg text-sm font-semibold border ${x.dataset.k === scanKind ? 'bg-teal-600 text-white border-teal-600' : 'bg-white text-slate-600 border-slate-300'}`);
      const sel = root.querySelector('#scCat'); if (sel) sel.value = scanKind === 'medical' ? 'Health' : autoCategorize(root.querySelector('#scNotes')?.value || '');
    });
  });
}
async function handleBillFile(file, root, out) {
  out.innerHTML = '<p class="text-sm text-slate-600 animate-pulse">🔍 Reading your bill…</p>';
  let img, receipt, parsed = null, note = '';
  try { img = await loadImg(file); } catch { out.innerHTML = '<p class="text-sm text-red-600">Could not open that image.</p>'; return; }
  receipt = jpegOf(img, 900, .6); if (receipt.length > 250000) receipt = jpegOf(img, 900, .4);
  if (receipt.length > 400000) { out.innerHTML = '<p class="text-sm text-red-600">That photo is too large to store. Try a closer crop.</p>'; return; }
  try { parsed = parseBillText(await ocrText(jpegOf(img, 1400, .85))); } catch { note = 'Couldn\'t auto-read this one (offline or blurry). Enter the total below.'; }
  if (parsed && parsed.medical) scanKind = 'medical';
  const notes = parsed ? (parsed.shop || (scanKind === 'medical' ? 'Pharmacy bill' : '')) : '';
  const cat = scanKind === 'medical' ? 'Health' : autoCategorize(notes);
  root.querySelectorAll('#scKind [data-k]').forEach(x => x.className = `py-2 rounded-lg text-sm font-semibold border ${x.dataset.k === scanKind ? 'bg-teal-600 text-white border-teal-600' : 'bg-white text-slate-600 border-slate-300'}`);
  out.innerHTML = `<form id="scForm" class="space-y-3"><img src="${esc(receipt)}" alt="Bill" class="w-full max-h-40 object-cover rounded-xl border"/>
    ${note ? `<p class="text-xs text-amber-700">${note}</p>` : '<p class="text-xs text-teal-700">✓ Read your bill. Please double-check the details.</p>'}
    <div class="grid grid-cols-2 gap-3"><label class="block text-sm font-medium">Total (₹)<input name="amount" type="number" step="0.01" min="1" value="${parsed && parsed.amount > 0 ? parsed.amount : ''}" class="${inCls}"/></label>
      <label class="block text-sm font-medium">Date<input name="date" type="date" max="${todayISO()}" value="${parsed ? parsed.date : todayISO()}" class="${inCls}"/></label></div>
    <label class="block text-sm font-medium">Shop / note<input id="scNotes" name="notes" value="${esc(notes)}" class="${inCls}"/></label>
    <label class="block text-sm font-medium">Category<select id="scCat" name="category" class="${inCls}">${catOptions(cat)}</select></label>
    <button class="w-full bg-teal-600 text-white font-semibold py-2.5 rounded-lg">Save expense with receipt</button></form>`;
  out.querySelector('#scForm').onsubmit = ev => {
    ev.preventDefault(); const fd = new FormData(ev.target), amt = Number(fd.get('amount'));
    if (!(amt > 0)) return toast('Enter the bill total', 'error');
    closeModal(); pushExpense({ amount:amt, category:fd.get('category'), notes:String(fd.get('notes')).trim() || (scanKind === 'medical' ? 'Medical bill' : 'Bill'), date:fd.get('date') || todayISO(), receipt });
  };
}
function homeShortcutsHTML() {
  const nb = unpaidBills().map(b => ({ b, d: nextDue(b) })).sort((a, c) => a.d - c.d)[0];
  const sub = nb ? `${esc(nb.b.title)} · ${nb.d.toLocaleDateString('en-IN', { day:'numeric', month:'short' })}` : 'Rent, WiFi…';
  const t = (icon, label, hint, fn, cls) => `<button onclick="${fn}" class="${cls || 'bg-white border border-slate-100 text-slate-900'} rounded-2xl p-3 shadow-sm text-center active:scale-95 transition"><div class="text-2xl">${icon}</div><p class="text-sm font-semibold mt-1">${label}</p><p class="text-[11px] opacity-70 truncate">${hint}</p></button>`;
  return `<div class="grid grid-cols-3 gap-3">${t('✨', 'Smart add', 'type or paste SMS', "openSmartAdd('')")}${t('📷', 'Scan bill', 'camera or photo', 'openScanBill()', 'bg-gradient-to-br from-teal-600 to-teal-700 text-white')}${t('💳', 'Bills', sub, 'openBills()')}</div>`;
}

window.addEventListener('hashchange', render);
window.addEventListener('load', render);
</script>

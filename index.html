<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fc">
  <meta name="description" content="Nivora - your private finance and health companion.">
  <title>Nivora</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#" aria-label="Nivora home"><span class="brand-mark">n</span><span>Nivora</span></a>
      <div class="side-label">WORKSPACE</div>
      <nav id="sideNav" class="side-nav">
        <button class="nav-item active" data-page="home"><span>⌂</span>Overview</button>
        <button class="nav-item" data-page="transactions"><span>↗</span>Transactions</button>
        <button class="nav-item" data-page="budgets"><span>▤</span>Budgets</button>
        <button class="nav-item" data-page="splits"><span>⇄</span>Shared expenses</button>
        <button class="nav-item" data-page="goals"><span>◎</span>Savings goals</button>
      </nav>
      <div class="side-label health-label">PERSONAL CARE</div>
      <nav class="side-nav">
        <button class="nav-item" data-page="medicines"><span>✚</span>Medicines</button>
        <button class="nav-item" data-page="bills"><span>▧</span>Bills & receipts</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="privacy-note"><span class="privacy-dot"></span><div><strong>Your data stays yours</strong><small>Stored on this device</small></div></div>
        <button class="nav-item" data-page="settings"><span>⚙</span>Settings</button>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div><div class="eyebrow" id="todayLabel">YOUR PERSONAL SPACE</div><h1 id="pageTitle">Overview</h1></div>
        <div class="top-actions"><span class="offline-pill"><i></i> Offline ready</span><button class="avatar" id="profileButton" aria-label="Edit profile">N</button></div>
      </header>
      <section id="pageContent" class="page-content" aria-live="polite"></section>
    </main>
  </div>

  <nav class="mobile-nav" id="mobileNav">
    <button class="mobile-item active" data-page="home"><span>⌂</span><small>Home</small></button>
    <button class="mobile-item" data-page="transactions"><span>↗</span><small>Activity</small></button>
    <button class="mobile-item" data-page="goals"><span>◎</span><small>Goals</small></button>
    <button class="mobile-item" data-page="medicines"><span>✚</span><small>Health</small></button>
    <button class="mobile-item" data-page="settings"><span>⚙</span><small>Settings</small></button>
  </nav>

  <dialog id="appDialog" class="app-dialog">
    <form method="dialog" class="dialog-head"><div><span class="eyebrow">NIVORA</span><h2 id="dialogTitle">Add item</h2></div><button class="icon-button" value="cancel" aria-label="Close">×</button></form>
    <div id="dialogBody" class="dialog-body"></div>
  </dialog>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
